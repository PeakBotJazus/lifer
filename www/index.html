<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заря — на связи</title>
<style>
:root{box-sizing:border-box;--bg:#eef1f6;--bar:#fff;--tx:#14181f;--mut:#6b7385;--in:#fff;--out:#2b7fff;--ok:#1fa971;--warn:#e0a100;--bad:#e5484d;--bd:#d8dde7;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--bar:#151a24;--tx:#e6e9f0;--mut:#8a93a8;--in:#1b2230;--out:#2b7fff;--bd:#252d3d}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{background:var(--bar);border-bottom:1px solid var(--bd);padding:10px 14px}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:#2b7fff;display:grid;place-items:center;font-size:20px}
.nm{font-weight:600}.st{font-size:12px;color:var(--mut)}
.stats{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--mut)}
.bar{height:5px;border-radius:3px;background:var(--bd);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .5s,background .5s}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;animation:p .2s}
.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:4px}
.out{background:var(--out);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.sys{align-self:center;font-size:12px;color:var(--mut);text-align:center}
.end{align-self:stretch;text-align:center;background:var(--bar);border:1px solid var(--bd);border-radius:14px;padding:14px}
.end b{font-size:18px;display:block;margin-bottom:4px}
@keyframes p{from{opacity:0;transform:translateY(6px)}}
#ch{padding:8px 12px 12px;background:var(--bar);border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;min-height:20px}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--out);border-radius:12px;padding:11px 12px;text-align:left}
button:active{background:var(--out);color:#fff}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px)}}
#sc{width:100%;height:150px;display:block;background:#05070d;border-bottom:1px solid var(--bd);flex:none}
</style></head><body>
<div id="app">
<header><div class="who"><div class="av">👨‍🚀</div><div><div class="nm">Игорь · станция «Заря»</div><div class="st" id="st">в сети</div></div></div>
<div class="stats">
<div class="chip">🫁 Кислород <span id="vo"></span><div class="bar"><i id="bo"></i></div></div>
<div class="chip">❤ Здоровье <span id="vh"></span><div class="bar"><i id="bh"></i></div></div>
<div class="chip">⚡ Энергия <span id="vp"></span><div class="bar"><i id="bp"></i></div></div>
</div></header>
<canvas id="sc"></canvas><div id="log"></div><div id="ch"></div>
</div>
<script>
const $=id=>document.getElementById(id),log=$('log'),ch=$('ch');
let S,busy=false,seen={};
try{seen=JSON.parse(localStorage.getItem('zarya_end')||'{}')}catch(e){}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function bars(){
 for(const[k,id]of[['o2','o'],['hp','h'],['pw','p']]){
  const v=Math.max(0,Math.min(100,S[k]));$('v'+id).textContent=v+'%';
  const b=$('b'+id);b.style.width=v+'%';b.style.background=v>50?'var(--ok)':v>25?'var(--warn)':'var(--bad)'}}
function add(txt,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function say(lines){
 for(const l of lines){
  $('st').textContent='печатает…';
  const d=document.createElement('div');d.className='m in dots';d.innerHTML='<span></span><span></span><span></span>';log.appendChild(d);log.scrollTop=log.scrollHeight;
  await sleep(500+Math.min(l.length*14,1100));
  d.className='m in';d.textContent=l;log.scrollTop=log.scrollHeight}
 $('st').textContent='в сети'}
function fx(o){if(!o)return;if(o.hp<0){flash=1;navigator.vibrate&&navigator.vibrate(80)}for(const k in o){if(k=='set')S.f[o.set]=1;else S[k]+=o[k]}bars()}
// Сюжет
const N={
start:{t:["…Диспетчер? Вы меня слышите?","Я очнулся в шлюзе станции «Заря». Земля молчит — вы единственный, кто отвечает.","Кислород в скафандре падает. Что мне делать?"],
 ch:[["Открой внутренний люк","hub"],["Сначала проверь скафандр","suit"]]},
suit:{t:["Так… В креплении запасной баллон! Подключаю.","Дышится легче. Пошли дальше?"],fx:{o2:20},ch:[["Открывай люк","hub"]]},
hub:{t(){S.hubs=(S.hubs||0)+1;
  if(S.hubs==1)return["Люк открыт. Коридор тёмный, аварийка мигает.","Слева — металлический стук. Реактор молчит, станция на батареях.","Куда идти?"];
  if(S.hubs==4){fx({o2:-10});return["СВИСТ! Где-то лопнула магистраль, воздух уходит! Кислород −10%.","Надо торопиться. Куда?"]}
  return["Я в коридоре. Куда дальше?"]},
 ch:[["В медотсек","med",0,s=>!s.f.med],["В реакторный отсек","reactor",0,s=>!s.f.pwr],["Пойти на стук","knock",0,s=>!s.f.vera],["К спасательной капсуле","capsule",0,s=>s.f.pwr]]},
med:{t:["Медотсек разгромлен. Нашёл аптечку — колю обезболивающее.","И ещё: в шкафу запасной предохранитель на реактор. Пригодится."],fx:{hp:30,set:'med'},
 ch:[["Забирай и возвращайся","hub",{set:'fuse'}]]},
reactor:{t(){return["Реактор заглох: сгорел предохранитель.",S.f.fuse?"У меня есть запасной. Ставить?":"Запасного нет. Можно перезапустить вручную, но там искрит и жарко."]},
 ch:[["Поставь предохранитель","hub",{pw:50,set:'pwr'},s=>s.f.fuse],["Перезапусти вручную","hub",{pw:50,hp:-35,set:'pwr'},s=>!s.f.fuse],["Пока уходи","hub"]]},
knock:{t(){return["Стук — из запертого отсека! Там кто-то есть. Это Вера, бортинженер!","Она жива, но у неё кончается воздух. Дверь "+(S.f.pwr?"под напряжением — панель работает.":"обесточена, панель мертва.")]},
 ch:[["Взломай панель","vera",0,s=>s.f.pwr],["Вскрой дверь ломом","vera",{hp:-20},s=>!s.f.pwr],["Вернись, потом разберёмся","hub"]]},
vera:{t:["Открылось! Вера выбралась, кашляет. Говорит: капсула на станции одна, а на двоих запаса воздуха почти нет.","Она идёт со мной."],fx:{o2:-10,set:'vera'},ch:[["Возвращайтесь в коридор","hub"]]},
capsule:{t(){return S.f.vera?["Капсула готова к старту. Мест два, но воздуха в ней — на одного с запасом.","Вера молчит. Решать вам."]:["Капсула заряжена и готова к старту.","Я слышу, как стук за стеной ещё не затих…"]},
 ch:[["Лететь вдвоём","go2",0,s=>s.f.vera],["Отдай место Вере","sac",0,s=>s.f.vera],["Запускай капсулу","alone",0,s=>!s.f.vera]]},
go2:{t(){return S.o2>=35?null:null},auto(){return S.o2>=35?'e_both':'e_bothfail'}},
sac:{auto:()=>'e_sac'},alone:{auto:()=>'e_alone'},
e_both:{end:["🌍 Оба спасены","Капсула вошла в атмосферу. Игорь и Вера выжили — благодаря вашему расчёту.","Лучший финал."],t:["Старт! Держится! Воздуха хватило на двоих!","Спасибо, диспетчер. Мы дома."]},
e_bothfail:{end:["💀 Не хватило воздуха","Кислорода было слишком мало. В капсуле стало тихо."],t:["Пик пик пик… воздуха мало… Вера?.. Вера!","Диспетчер… я… не…"]},
e_sac:{end:["🕯 Жертва","Игорь остался на станции. Вера вернулась домой и рассказала, кто их спас."],t:["Вера плачет, но уходит. Старт.","Я останусь на связи, пока батареи держат. Просто поговорим, ладно?"]},
e_alone:{end:["🚀 Выжил один","Игорь вернулся на Землю."],t(){return S.f.hubs_vera?[]:["Старт! Я лечу домой.","Но стук… он ещё долго будет мне сниться. Если бы мы вернулись пораньше…"]}},
d_o2:{end:["💀 Кислород закончился","Игорь потерял сознание в коридоре станции."],t:["Дыш… не могу… темно…"]},
d_hp:{end:["💀 Игорь погиб","Раны оказались слишком серьёзными."],t:["Слишком… больно… передайте… что я…"]}
};
async function show(id){
 busy=true;ch.innerHTML='';
 let n=N[id];scene=SC[id]||scene;
 if(n.auto){return show(n.auto())}
 const lines=typeof n.t=='function'?n.t():n.t;
 if(n.fx)fx(n.fx);
 await say(lines||[]);
 if(n.end){finish(id,n);return}
 if(S.o2<=0){return show('d_o2')}
 if(S.hp<=0){return show('d_hp')}
 for(const c of n.ch){
  if(c[3]&&!c[3](S))continue;
  const b=document.createElement('button');b.textContent=c[0];
  b.onclick=()=>pick(c);ch.appendChild(b)}
 busy=false;log.scrollTop=log.scrollHeight}
function pick(c){
 if(busy)return;busy=true;
 add(c[0],'out');ch.innerHTML='';
 S.o2-=6;if(c[2]){if(c[2].set)S.f[c[2].set]=1;fx(Object.fromEntries(Object.entries(c[2]).filter(([k])=>k!='set')))}bars();
 // смерть после действия
 if(S.o2<=0){return show('d_o2')}
 if(S.hp<=0){return show('d_hp')}
 show(c[1])}
function finish(id,n){
 seen[id]=1;try{localStorage.setItem('zarya_end',JSON.stringify(seen))}catch(e){}
 const d=document.createElement('div');d.className='m end';
 d.innerHTML='<b></b><div></div><div class="st" style="margin-top:6px"></div>';
 d.querySelector('b').textContent=n.end[0];d.children[1].textContent=n.end[1];
 d.children[2].textContent='Концовок открыто: '+Object.keys(seen).length+' из 6';
 log.appendChild(d);log.scrollTop=log.scrollHeight;
 const b=document.createElement('button');b.textContent='🔄 Начать заново';b.onclick=start;ch.appendChild(b);busy=false}
function start(){S={o2:62,hp:100,pw:5,f:{},hubs:0};log.innerHTML='';ch.innerHTML='';bars();
 add('Связь установлена · канал станции «Заря»','m sys');show('start')}
const SC={start:'gate',suit:'gate',hub:'hall',med:'med',reactor:'reactor',knock:'door',vera:'door',capsule:'cap',e_both:'earth',e_bothfail:'dead',e_sac:'sac',e_alone:'earth',d_o2:'dead',d_hp:'dead'};
const LBL={gate:'ШЛЮЗ А-1',hall:'КОРИДОР',med:'МЕДОТСЕК',reactor:'РЕАКТОР',door:'ОТСЕК Б-7',cap:'КАПСУЛА',earth:'ОРБИТА',sac:'СТАНЦИЯ «ЗАРЯ»',dead:'НЕТ СИГНАЛА'};
const sc=$('sc'),sg=sc.getContext('2d'),SH=150;
let SW=360,scene='gate',flash=0;
const stars=Array.from({length:50},()=>({x:Math.random(),y:Math.random(),s:Math.random()*.5+.1}));
function sr(){const D=Math.min(devicePixelRatio||1,2);SW=sc.clientWidth||360;sc.width=SW*D;sc.height=SH*D;sg.setTransform(D,0,0,D,0,0)}
addEventListener('resize',sr);sr();
function astro(x,y,suit,t){
 const b=Math.sin(t*2+x)*1.5;sg.save();sg.translate(x,y+b);
 sg.fillStyle='#6b7488';sg.fillRect(-20,-10,8,30);
 sg.fillStyle=suit;sg.beginPath();sg.roundRect(-14,-12,28,36,8);sg.fill();
 sg.fillRect(-12,22,10,14);sg.fillRect(2,22,10,14);
 sg.fillStyle='#eef1f7';sg.beginPath();sg.arc(0,-24,15,0,7);sg.fill();
 sg.fillStyle='#10223a';sg.beginPath();sg.roundRect(-4,-31,16,14,6);sg.fill();
 sg.fillStyle='rgba(120,200,255,.5)';sg.fillRect(0,-29,6,3);
 sg.restore()}
function drawSc(ms){
 const w=SW,h=SH,t=ms/1000,cx=w/2,cy=h*.46;
 const bg={gate:'#0b1220',hall:'#0a0f1a',med:'#0a1a1a',reactor:'#1a0e0a',door:'#0d1018',cap:'#060a14',earth:'#02040a',dead:'#0c0306',sac:'#02040a'}[scene]||'#0b1220';
 sg.fillStyle=bg;sg.fillRect(0,0,w,h);
 const space=scene=='cap'||scene=='earth'||scene=='sac'||scene=='dead';
 const lamp=Math.sin(t*(S.o2<25?10:3))>.1;
 if(space){for(const s of stars){s.x=(s.x-s.s*.0006+1)%1;sg.fillStyle='rgba(255,255,255,'+(.35+.35*Math.sin(t*3+s.y*9))+')';sg.fillRect(s.x*w,s.y*h,1.6,1.6)}}
 else{
  const sp=scene=='hall'?.5:scene=='gate'?.12:.05;
  sg.strokeStyle={med:'#2a6d6d',reactor:'#6d3a2a'}[scene]||'#2b3a5c';sg.lineWidth=2;
  for(let i=0;i<7;i++){const k=((i+t*sp)%7)/7,q=k*k,hw=14+q*w*.8,hh=8+q*h*.9;sg.globalAlpha=.25+k*.6;sg.strokeRect(cx-hw,cy-hh,hw*2,hh*2)}
  sg.globalAlpha=1;sg.beginPath();
  for(const[x,y]of[[0,0],[w,0],[0,h],[w,h]]){sg.moveTo(cx+(x-cx)*.07,cy+(y-cy)*.07);sg.lineTo(x,y)}sg.stroke();
  const g2=sg.createRadialGradient(w-30,16,2,w-30,16,40);g2.addColorStop(0,lamp?'rgba(255,60,60,.9)':'rgba(255,60,60,.1)');g2.addColorStop(1,'rgba(255,60,60,0)');sg.fillStyle=g2;sg.fillRect(w-80,0,80,60)}
 if(scene=='door'){const dw=70,dh=100,dx=cx+30,dy=cy-dh/2+10;
  sg.fillStyle='#1c2233';sg.fillRect(dx,dy,dw,dh);sg.fillStyle=S.f.vera?'#05070d':'#2a3350';sg.fillRect(dx+6,dy+6,dw-12,dh-12);
  sg.fillStyle=S.f.pwr?'#3ddc97':(lamp?'#ff4d4d':'#552');sg.beginPath();sg.arc(dx+dw+10,cy-8,5,0,7);sg.fill();
  if(!S.f.vera&&Math.sin(t*5)>0){sg.fillStyle='rgba(255,255,255,.6)';sg.font='11px monospace';sg.fillText('тук… тук…',dx+8,dy-4)}}
 if(scene=='med'){sg.fillStyle='#2fe0a0';sg.globalAlpha=.7+.3*Math.sin(t*2);sg.fillRect(cx+50,cy-30,16,48);sg.fillRect(cx+34,cy-14,48,16);sg.globalAlpha=1}
 if(scene=='reactor'){const on=S.f.pwr,r=24+Math.sin(t*(on?3:12))*(on?3:5),c=on?'61,220,151':'255,122,61',x=cx+60;
  const gr=sg.createRadialGradient(x,cy,2,x,cy,r*2);gr.addColorStop(0,'rgba('+c+','+(on?.95:.45+.2*Math.random())+')');gr.addColorStop(1,'rgba('+c+',0)');sg.fillStyle=gr;sg.fillRect(x-r*2,cy-r*2,r*4,r*4);
  if(!on){sg.strokeStyle='#ffd23f';sg.lineWidth=1;for(let i=0;i<3;i++)if(Math.random()<.3){const a=x-20+Math.random()*40,b=cy-30+Math.random()*60;sg.beginPath();sg.moveTo(a,b);sg.lineTo(a+Math.random()*14-7,b+Math.random()*14-7);sg.stroke()}}}
 if(scene=='cap'){const x=cx+70,y=cy;sg.fillStyle='#d8dfec';sg.beginPath();sg.ellipse(x,y,46,26,0,0,7);sg.fill();
  sg.fillStyle='#10223a';sg.beginPath();sg.arc(x+10,y-4,10,0,7);sg.fill();
  sg.fillStyle='#ff7a3d';sg.globalAlpha=.4+.4*Math.random();sg.beginPath();sg.moveTo(x-46,y);sg.lineTo(x-80,y-6);sg.lineTo(x-80,y+6);sg.fill();sg.globalAlpha=1}
 if(scene=='earth'||scene=='sac'){const g3=sg.createRadialGradient(cx,h+60,60,cx,h+120,200);g3.addColorStop(0,'#3a8bff');g3.addColorStop(.6,'#1a4fa0');g3.addColorStop(1,'#08183a');
  sg.fillStyle=g3;sg.beginPath();sg.arc(cx,h+110,170,0,7);sg.fill();
  if(scene=='earth'){const p=(t*.08)%1,x=20+p*(w-40),y=20+p*60;sg.fillStyle='#fff';sg.fillRect(x,y,4,3);sg.fillStyle='rgba(255,170,80,.6)';sg.fillRect(x-9,y+1,9,2)}
  else{const x=w*.65;sg.fillStyle='#2a3350';sg.fillRect(x,30,60,16);sg.fillRect(x+25,20,10,36);sg.fillStyle=lamp?'#ff4d4d':'#552';sg.fillRect(x+54,34,4,4)}}
 if(scene=='dead'){sg.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<70;i++)sg.fillRect(Math.random()*w,Math.random()*h,2+Math.random()*10,1)}
 if(!['dead','sac','earth'].includes(scene)){astro(w*.3,cy+6,'#c9d3e6',t);if(S.f.vera&&scene!='gate')astro(w*.13,cy+6,'#ff9a4d',t+1)}
 sg.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<h;y+=3)sg.fillRect(0,y,w,1);
 if(S.o2<25){const a=.15+.12*Math.sin(t*6),vg=sg.createRadialGradient(cx,cy,h*.3,cx,cy,w*.6);vg.addColorStop(0,'rgba(255,0,0,0)');vg.addColorStop(1,'rgba(255,0,0,'+a+')');sg.fillStyle=vg;sg.fillRect(0,0,w,h)}
 if(flash>0){sg.fillStyle='rgba(255,40,40,'+flash*.5+')';sg.fillRect(0,0,w,h);flash=Math.max(0,flash-.04)}
 sg.fillStyle='rgba(255,255,255,.65)';sg.font='10px monospace';sg.fillText(LBL[scene]||'',24,14);
 sg.fillStyle=Math.sin(t*3)>0?'#ff4d4d':'#552';sg.beginPath();sg.arc(14,11,4,0,7);sg.fill()}
function lp(ms){if(S)drawSc(ms);requestAnimationFrame(lp)}requestAnimationFrame(lp);
start();
</script></body></html>
